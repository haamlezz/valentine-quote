<!doctype html>
<html lang="lo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ທຳນາຍຄວາມຮັກຈາກດອກກຸຫຼາບ" />
    <meta
      property="og:description"
      content="ຄົ້ນຫາຄວາມຮັກຂອງທ່ານຜ່ານສີຂອງດອກກຸຫຼາບ"
    />
    <meta property="og:image" content="img/thumbnail.png" />
    <meta
      property="og:url"
      content="https://haamlezz.github.io/valentine-quote"
    />
    <title>ທຳນາຍຄວາມຮັກຈາກດອກກຸຫຼາບ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@100..900&family=Noto+Sans+Lao:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom animation for the loader */

      *,
      body {
        font-family: "Noto Sans Lao Looped", sans-serif;
        font-optical-sizing: auto;

        font-style: normal;
        font-variation-settings: "wdth" 100;
      }

      @keyframes spinner {
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spinner {
        animation: spinner 0.8s linear infinite;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 flex flex-col items-center justify-center min-h-screen font-sans"
  >
    <div
      id="loader"
      class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50"
    >
      <div
        class="w-16 h-16 border-4 border-t-pink-500 border-gray-200 rounded-full animate-spinner"
      ></div>
      <p class="mt-4 text-gray-600 font-semibold">
        ກຳລັງເລືອກດອກກຸຫຼາບໃຫ້ທ່ານ...
      </p>
    </div>

    <div
      class="flex flex-col items-center p-6 bg-white rounded-3xl shadow-2xl max-w-lg w-full"
    >
      <h1 class="text-3xl font-extrabold text-gray-900 mb-6">
        ດອກກຸຫຼາບແຫ່ງຄວາມຮັກ
      </h1>

      <div
        id="imageContainer"
        class="w-full h-80 rounded-2xl overflow-hidden shadow-inner mb-6 bg-gray-200 flex items-center justify-center"
      >
        <img
          id="rosePhoto"
          src=""
          alt="ດອກກຸຫຼາບ"
          class="w-full h-full object-cover hidden"
        />
      </div>

      <div
        id="message"
        class="text-center text-lg font-medium text-gray-800 p-5 rounded-xl w-full mb-6"
      ></div>

      <button
        onclick="generateRose()"
        class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 transform hover:scale-105"
      >
        ສຸ່ມດອກໃໝ່
      </button>
    </div>

    <script>
      const loader = document.getElementById("loader");
      const rosePhoto = document.getElementById("rosePhoto");
      const messageDiv = document.getElementById("message");

      // 1. Define Colors, Predictions, and File Mapping
      const colorData = {
        red: {
          text: "text-red-900",
          bg: "bg-red-50",
          quote: "ສີແດງ: ຄວາມຮັກທີ່ຮ້ອນແຮງ, ເລິກເຊິ່ງ ແລະ ເປັນນິດນິລັນ.",
        },
        blue: {
          text: "text-blue-900",
          bg: "bg-blue-50",
          quote:
            "ສີຟ້າ: ຄວາມຮັກທີ່ລຶກລັບ, ອາດຈະເປັນຄົນທີ່ຫາໄດ້ຍາກ ຫຼື ເອື້ອມບໍ່ເຖິງ.",
        },
        white: {
          text: "text-gray-900",
          bg: "bg-gray-100",
          quote: "ສີຂາວ: ຄວາມຮັກທີ່ບໍລິສຸດ, ໃສຊື່ ແລະ ການເລີ່ມຕົ້ນໃໝ່.",
        },
        pink: {
          text: "text-pink-900",
          bg: "bg-pink-50",
          quote:
            "ສີຊົມພູ: ຄວາມຮັກທີ່ອ່ອນໂຍນ ເຕັມໄປດ້ວຍຄວາມຊື່ນຊົມ ແລະ ຄວາມກະຕັນຍູ.",
        },
        purple: {
          text: "text-purple-900",
          bg: "bg-purple-50",
          quote: "ສີມ່ວງ: ມົນສະເໜ່ຕັ້ງແຕ່ທຳອິດເຫັນ; ຄວາມຜູກພັນທີ່ມະຫັດສະຈັນ.",
        },
        orange: {
          text: "text-orange-900",
          bg: "bg-orange-50",
          quote:
            "ສີສົ້ມ: ຄວາມຮັກທີ່ເຕັມໄປດ້ວຍຄວາມກະຕືລືລົ້ນ, ຄວາມປາດຖະໜາ ແລະ ຄວາມຫຼົງໄຫຼ.",
        },
        yellow: {
          text: "text-yellow-900",
          bg: "bg-yellow-50",
          quote:
            "ສີເຫຼືອງ: ຄວາມຮັກທີ່ສົດໃສ ບົນພື້ນຖານຂອງມິດຕະພາບທີ່ເລິກເຊິ່ງ ແລະ ຄວາມສຸກ.",
        },
        green: {
          text: "text-green-900",
          bg: "bg-green-50",
          quote: "ສີຂຽວ: ຄວາມຮັກທີ່ໝັ້ນຄົງ, ການເຕີບໂຕ ແລະ ຄວາມສົມດຸນ.",
        },
        multi: {
          text: "text-indigo-900",
          bg: "bg-indigo-50",
          quote:
            "ສີປະສົມ: ຄວາມຮັກທີ່ມີສີສັນຫຼາກຫຼາຍ, ຕື່ນເຕັ້ນ ແລະ ບໍ່ໜ້າເບື່ອ.",
        },
      };

      function generateRose() {
        // Show loader
        loader.classList.remove("hidden");
        rosePhoto.classList.add("hidden");

        // 2. Randomly select a color
        const colors = Object.keys(colorData);
        const randomColorName =
          colors[Math.floor(Math.random() * colors.length)];
        const selectedData = colorData[randomColorName];

        // 3. Set Prediction Text and Tailwind Styles
        messageDiv.innerText = selectedData.quote;
        messageDiv.className = `text-center text-lg font-medium p-5 rounded-xl w-full mb-6 ${selectedData.text} ${selectedData.bg}`;

        // 4. Update image source to local folder
        // Assuming your file structure is: index.html, img/red.jpg, etc.
        rosePhoto.src = `img/${randomColorName}.jpg`;

        // Artificial delay for effect (2 seconds)
        setTimeout(() => {
          rosePhoto.classList.remove("hidden");
          loader.classList.add("hidden");
        }, 2000);
      }

      // Run on load
      generateRose();
    </script>
  </body>
</html>
